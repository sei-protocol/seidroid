apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "seidroid.fullname" . }}
  labels:
    {{- include "seidroid.labels" . | nindent 4 }}
data:
  {{- with .Values.config }}
  SEIDROID_TEAM: {{ .team | quote }}
  SEIDROID_BOTS: {{ join "," .bots | quote }}
  SEIDROID_OWNERS: {{ join "," .owners | quote }}
  SEIDROID_WORKFLOW: {{ .workflow | quote }}
  SEIDROID_TRUNK: {{ .trunk | quote }}
  SEIDROID_CHECK_NAME: {{ .checkName | quote }}
  SEIDROID_COMPARE_CHECK: {{ .compare.check | quote }}
  SEIDROID_COMPARE_JOB: {{ .compare.job | quote }}
  SEIDROID_COMPARE_WAIT_MINUTES: {{ .compare.waitMinutes | quote }}
  {{- end }}
  {{- with .Values.config.sessions }}
  SEIDROID_SESSION_STORE: {{ .store | quote }}
  {{- if eq .store "s3" }}
  SEIDROID_SESSION_BUCKET: {{ required "config.sessions.s3.bucket is required with config.sessions.store s3" .s3.bucket | quote }}
  SEIDROID_SESSION_PREFIX: {{ .s3.prefix | quote }}
  {{- with .s3.region }}
  AWS_REGION: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- $host := "" }}
  {{- range .Values.httpRoute.hostnames }}
  {{- if and (not $host) (not (contains "*" .)) }}{{ $host = . }}{{ end }}
  {{- end }}
  {{- with .Values.config.audience | default (and $host (printf "https://%s" $host)) }}
  SEIDROID_AUDIENCE: {{ . | quote }}
  {{- end }}
