apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "seidroid.fullname" . }}
  labels:
    {{- include "seidroid.labels" . | nindent 4 }}
data:
  {{- with .Values.config }}
  SEIDROID_TEAM: {{ .team | quote }}
  SEIDROID_BOTS: {{ join "," .bots | quote }}
  SEIDROID_OWNERS: {{ join "," .owners | quote }}
  SEIDROID_WORKFLOW: {{ .workflow | quote }}
  SEIDROID_TRUNK: {{ .trunk | quote }}
  SEIDROID_CHECK_NAME: {{ .checkName | quote }}
  {{- end }}
  {{- $host := "" }}
  {{- range .Values.httpRoute.hostnames }}
  {{- if and (not $host) (not (contains "*" .)) }}{{ $host = . }}{{ end }}
  {{- end }}
  {{- with .Values.config.audience | default (and $host (printf "https://%s" $host)) }}
  SEIDROID_AUDIENCE: {{ . | quote }}
  {{- end }}
