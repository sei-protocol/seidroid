nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/sei-protocol/seidroid
  # Defaults to the chart's appVersion, which is the image it was published
  # with, pinned by digest. digest pins any other tag.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The GitHub App the service publishes as. The chart never creates this Secret,
# so the private key stays wherever the cluster keeps its secrets.
githubApp:
  existingSecret: seidroid-app
  appIdKey: app-id
  privateKeyKey: private-key

# Service settings, written to the chart's ConfigMap.
config:
  # The team whose members may request a review and get one on push, as org/team-slug. Required.
  team: ""
  # Bot logins that may request a review as well, e.g. seidroid[bot].
  bots: []
  # Owners whose repositories the service publishes to.
  owners:
    - sei-protocol
  # The reusable workflow a caller's OIDC token must come from, and the branch
  # its commit must be on.
  workflow: sei-protocol/seidroid/.github/workflows/review.yml
  trunk: main
  checkName: Seidroid Review
  # The audience a caller's OIDC token must be issued for: the origin callers
  # reach the service at. Defaults to https:// and the first httpRoute hostname
  # without a wildcard.
  audience: ""
  # Where the service finds v1's verdict on each commit it reviews in shadow, to
  # compare the two in its metrics: the check run v1 publishes as the same App,
  # the check run of v1's review job, and how long to wait for v1. An empty
  # check compares nothing.
  compare:
    check: review
    job: seidroid-review / Review
    waitMinutes: 180

# More ConfigMaps or Secrets to load settings from, as container envFrom
# entries. The chart's own settings win over the same key in one of these.
# SEIDROID_SESSION_BUCKET names the S3 bucket that keeps each pull request's
# review session, with AWS_REGION its region; without it the service keeps none
# and every review starts cold.
envFrom: []

serviceAccount:
  create: true
  # Defaults to the full name when empty.
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

service:
  port: 80

# Routes /healthz, /allow, /history, /publish and /reply through the Gateway API. /metrics is
# never routed.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []

# Scrapes /metrics through the Service with a Prometheus Operator ServiceMonitor.
serviceMonitor:
  enabled: false
  labels: {}
  interval: ""
