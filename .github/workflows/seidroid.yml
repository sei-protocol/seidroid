name: Seidroid

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  seidroid:
    # A pull_request run from a fork gets no OIDC token, which the review needs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # A released commit, not ./: the service admits review.yml only from main.
    uses: sei-protocol/seidroid/.github/workflows/review.yml@c9706feea6d1ff72e9457a66786b2adfac2fd068 # v0.3.3
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      shadow: false
      approve-on-success: true
      allowed-bots: seidroid[bot]
      # The review's sandbox has no network, so install the dependencies first.
      prepare: npm ci --ignore-scripts
      extra-instructions: >-
        Dependencies are installed in node_modules. Typecheck with `npx tsc`
        and test with `npm test`.
